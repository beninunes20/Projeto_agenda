services:
  # Serviço da aplicação Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenda-app
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - mongodb
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # String de conexão usada pelo Mongoose e pelo connect-mongo
      CONNECTIONSTRING: ${CONNECTIONSTRING}
    volumes:
      - .:/app
      - /app/node_modules
    command: npm start
    networks:
      - app-network

  # Serviço do banco MongoDB
  mongodb:
    image: mongo:7
    container_name: agenda-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: senhasegura123
      MONGO_INITDB_DATABASE: agenda
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - app-network

  # Dashboard web para gerenciar o MongoDB
  mongo-express:
    image: mongo-express:1.0.2
    container_name: agenda-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: senhasegura123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_URL: mongodb://admin:senhasegura123@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongodb
    networks:
      - app-network

volumes:
  mongo_data:
  mongo_config:

networks:
  app-network:
    driver: bridge